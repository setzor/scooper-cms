<header class="paper-header">
    <div class="header-container">
        <div class="logo">
            <a href="/">{% include "partials/illu_cat.html" %}{{ site_title }}</a>
        </div>
        <p class="tagline">{{ site_description }}</p>
    </div>
    <nav class="paper-nav">
        <button
            class="theme-toggle paper-theme-toggle"
            onclick="toggleTheme()"
            title="Toggle dark/light mode"
            aria-label="Toggle dark/light mode"
        >
            <span id="theme-icon">{{ theme_icon }}</span>
        </button>
        <a href="/cms" class="cms-link">
            <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg></span>
            Pencil
        </a>
    </nav>
</header>
