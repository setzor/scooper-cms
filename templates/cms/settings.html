{% include "partials/cms_head.html" %}
{% include "partials/cms_chrome.html" %}

<div class="cms-content">
    <form action="/cms/settings" method="post" class="settings-form">
        <input
            type="hidden"
            name="csrf_token"
            value="{{ csrf_token }}"
        />
        <div class="settings-section">
            <h2>Site Settings</h2>

            <div class="form-group">
                <label for="site_title">Site Title</label>
                <input
                    type="text"
                    id="site_title"
                    name="site_title"
                    value="{{ site_title }}"
                    required
                    placeholder="Your site name"
                />
            </div>

            <div class="form-group">
                <label for="site_description">Site Description</label>
                <input
                    type="text"
                    id="site_description"
                    name="site_description"
                    value="{{ site_description_value }}"
                    placeholder="Short tagline for your site"
                />
            </div>

            <div class="form-group">
                <label>Theme</label>
                <div class="theme-selector">
                    <select
                        id="theme-select"
                        name="theme"
                        class="theme-dropdown"
                    >
                        <option value="light" {% if theme == "light" %}selected{% endif %}>
                            Vanilla Cream
                        </option>
                        <option value="dark" {% if theme == "dark" %}selected{% endif %}>
                            Midnight Chocolate
                        </option>
                        <option value="rose-pine-dawn" {% if theme == "rose-pine-dawn" %}selected{% endif %}>
                            Rose Pine Dawn
                        </option>
                        <option value="rose-pine" {% if theme == "rose-pine" %}selected{% endif %}>
                            Rose Pine
                        </option>
                        <option value="catpuccin-latte" {% if theme == "catpuccin-latte" %}selected{% endif %}>
                            Catppuccin Latte
                        </option>
                        <option value="catpuccin-frappe" {% if theme == "catpuccin-frappe" %}selected{% endif %}>
                            Catppuccin Frappe
                        </option>
                        <option value="catpuccin-macchiato" {% if theme == "catpuccin-macchiato" %}selected{% endif %}>
                            Catppuccin Macchiato
                        </option>
                        <option value="catpuccin-mocha" {% if theme == "catpuccin-mocha" %}selected{% endif %}>
                            Catppuccin Mocha
                        </option>
                    </select>
                    <div id="theme-preview" class="theme-preview">
                        <div class="preview-container">
                            <div class="preview-header" id="preview-header"></div>
                            <div class="preview-body" id="preview-body"></div>
                            <div class="preview-footer" id="preview-footer"></div>
                        </div>
                        <div class="preview-accents">
                            <div class="preview-btn" id="preview-btn"></div>
                            <div class="preview-accent" id="preview-accent"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="settings-section">
            <h2>Categories</h2>
            <input type="hidden" id="action" name="action" />

            <div class="form-group">
                <label for="new_category">Add New Category</label>
                <div class="category-add">
                    <input
                        type="text"
                        id="new_category"
                        name="new_category"
                        placeholder="Enter category name"
                    />
                    <button
                        type="button"
                        class="btn btn-small btn-primary"
                        onclick="
                            setAction('add_category');
                            hasUnsavedChanges = false;
                            document
                                .querySelector('form')
                                .submit();
                        "
                    >
                        Add
                    </button>
                </div>
            </div>

            <div class="form-group">
                <label>Existing Categories</label>
                <div class="category-list">
                    {% for cat in categories %}
                    <div class="category-item">
                        <span class="category-name">{{ cat.name }}</span>
                        <div class="category-actions">
                            <button
                                type="button"
                                class="btn btn-tiny btn-secondary edit-category-btn"
                                data-category-id="{{ cat.id }}"
                                data-category-name="{{ cat.name }}"
                            >
                                Edit
                            </button>
                            <button
                                type="button"
                                class="btn btn-tiny btn-danger delete-category-btn"
                                data-category-id="{{ cat.id }}"
                                data-category-name="{{ cat.name }}"
                            >
                                Delete
                            </button>
                        </div>
                    </div>
                    {% endfor %}
                </div>
            </div>

            <!-- Hidden fields for category edit/delete -->
            <input
                type="hidden"
                id="edit_category_id"
                name="edit_category_id"
            />
            <input
                type="hidden"
                id="edit_category_name"
                name="edit_category_name"
            />
            <input
                type="hidden"
                id="delete_category_id"
                name="delete_category_id"
            />
        </div>

        <div class="form-actions">
            <button
                type="submit"
                class="btn btn-primary"
                name="action"
                value="save_settings"
            >
                <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span>
                Save Settings
            </button>
            <a href="/cms/dashboard" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
</main>
</div>

<script src="/static/js/script.js" defer></script>
<script>
    function setAction(val) {
        document.getElementById("action").value = val;
    }

    // Theme selection - preview on dropdown change
    document.addEventListener("DOMContentLoaded", function () {
        const themeSelect = document.getElementById("theme-select");
        const previewHeader = document.getElementById("preview-header");
        const previewBody = document.getElementById("preview-body");
        const previewFooter = document.getElementById("preview-footer");
        const previewBtn = document.getElementById("preview-btn");
        const previewAccent = document.getElementById("preview-accent");

        // Theme color definitions for preview - header, body, footer, button, accent
        const themeColors = {
            light: {
                header: "#fffaf4",
                body: "#faf3ea",
                footer: "#362529",
                btn: "#d95d78",
                accent: "#e0a458",
            },
            dark: {
                header: "#2a1f26",
                body: "#241b21",
                footer: "#1c141a",
                btn: "#e87f96",
                accent: "#e8b465",
            },
            "rose-pine-dawn": {
                header: "#fffaf3",
                body: "#faf4ed",
                footer: "#575279",
                btn: "#d7827e",
                accent: "#ea9d34",
            },
            "rose-pine": {
                header: "#1f1d2e",
                body: "#191724",
                footer: "#26233a",
                btn: "#eb6f92",
                accent: "#f6c177",
            },
            "catpuccin-latte": {
                header: "#ffffff",
                body: "#eff1f5",
                footer: "#4c4f69",
                btn: "#ea76cb",
                accent: "#df8e1d",
            },
            "catpuccin-frappe": {
                header: "#3b4157",
                body: "#303446",
                footer: "#232634",
                btn: "#f4b8e4",
                accent: "#e5c890",
            },
            "catpuccin-macchiato": {
                header: "#30344a",
                body: "#24273a",
                footer: "#1e2030",
                btn: "#f5bde6",
                accent: "#eed49f",
            },
            "catpuccin-mocha": {
                header: "#2a2b3c",
                body: "#1e1e2e",
                footer: "#11111b",
                btn: "#f5c2e7",
                accent: "#f9e2af",
            },
        };

        function updateThemePreview(theme) {
            const colors = themeColors[theme] || themeColors["light"];
            previewHeader.style.backgroundColor = colors.header;
            previewBody.style.backgroundColor = colors.body;
            previewFooter.style.backgroundColor = colors.footer;
            previewBtn.style.backgroundColor = colors.btn;
            previewAccent.style.backgroundColor = colors.accent;
        }

        // Update preview on dropdown change
        if (themeSelect) {
            themeSelect.addEventListener("change", function () {
                updateThemePreview(this.value);
            });
            // Initialize preview with current theme
            updateThemePreview(themeSelect.value);
        }

        // Sync theme to localStorage on form submit (so page reload picks it up)
        const settingsForm = document.querySelector(".settings-form");
        if (settingsForm) {
            settingsForm.addEventListener("submit", function () {
                const selectedTheme = themeSelect ? themeSelect.value : null;
                if (selectedTheme) {
                    localStorage.setItem("scooper-theme", selectedTheme);
                }
            });
        }

        // Category management handlers
        // Edit category buttons
        document
            .querySelectorAll(".edit-category-btn")
            .forEach(function (btn) {
                btn.addEventListener("click", function () {
                    var categoryId =
                        this.getAttribute("data-category-id");
                    var categoryName =
                        this.getAttribute("data-category-name");
                    var newName = prompt("Edit category name:", categoryName);
                    if (newName !== null && newName.trim() !== "") {
                        document.getElementById(
                            "edit_category_id",
                        ).value = categoryId;
                        document.getElementById(
                            "edit_category_name",
                        ).value = newName.trim();
                        setAction("edit_category");
                        hasUnsavedChanges = false;
                        document.querySelector("form").submit();
                    }
                });
            });

        // Delete category buttons
        document
            .querySelectorAll(".delete-category-btn")
            .forEach(function (btn) {
                btn.addEventListener("click", function () {
                    var categoryId =
                        this.getAttribute("data-category-id");
                    var categoryName =
                        this.getAttribute("data-category-name");
                    if (
                        confirm(
                            'Are you sure you want to delete "' +
                                categoryName +
                                '"? Stories using this category will keep their category name as text.',
                        )
                    ) {
                        document.getElementById(
                            "delete_category_id",
                        ).value = categoryId;
                        setAction("delete_category");
                        hasUnsavedChanges = false;
                        document.querySelector("form").submit();
                    }
                });
            });
    });
</script>
</body>
</html>
